name: Build Fengchi Kernel

on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: 'Base kernel repo'
        default: 'OnePlusOSS/android_kernel_common_oneplus_sm8475'
      base_branch:
        description: 'Base branch (Ace Pro / 10T, 5.10.236)'
        default: 'oneplus/sm8475_v_15.0.0_oneplus_10t'
      vendor_repo:
        description: 'Vendor repo (kernel_platform build/oplus/qcom + vendor)'
        default: 'OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8475'
      vendor_branch:
        description: 'Vendor branch'
        default: 'oneplus/sm8475_v_15.0.0_oneplus_10t'
  push:
    branches: [ main ]
    paths-ignore:
      - '*.img'
      - 'SHA256SUMS.txt'
      - 'README.md'

env:
  BASE_REPO: ${{ github.event.inputs.base_repo || 'OnePlusOSS/android_kernel_common_oneplus_sm8475' }}
  BASE_BRANCH: ${{ github.event.inputs.base_branch || 'oneplus/sm8475_v_15.0.0_oneplus_10t' }}
  # vendor tree: provides kernel_platform/{build,oplus,qcom} and vendor/, which
  # common/drivers/soc/oplus/storage symlinks into
  VENDOR_REPO: ${{ github.event.inputs.vendor_repo || 'OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8475' }}
  VENDOR_BRANCH: ${{ github.event.inputs.vendor_branch || 'oneplus/sm8475_v_15.0.0_oneplus_10t' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install toolchain (clang + lld are REQUIRED)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev python3 python3-pip \
            git rsync cpio kmem kmod lz4 zstd xz-utils || \
          sudo apt-get install -y -qq \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev python3 python3-pip \
            git rsync cpio lz4 zstd xz-utils
          echo "--- versions ---"
          clang --version | head -2 || true
          ld.lld --version | head -1 || true
          aarch64-linux-gnu-gcc --version | head -1 || true
          which clang ld.lld || true
          df -h /

      - name: Resolve LLVM toolchain path
        run: |
          FOUND=""
          for d in /usr/lib/llvm-14/bin /usr/lib/llvm-15/bin /usr/lib/llvm-16/bin /usr/lib/llvm-17/bin /usr/bin; do
            if [ -x "$d/clang" ] && [ -x "$d/ld.lld" ]; then FOUND="$d"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::no clang+lld pair found in any known location"
            ls -la /usr/lib/llvm-*/bin 2>/dev/null | head -20
            ls -la /usr/bin/ld.lld* /usr/bin/clang* 2>/dev/null | head -20
            exit 1
          fi
          echo "using LLVM from $FOUND"
          "$FOUND/clang"   --version | head -2
          "$FOUND/ld.lld"  --version | head -1
          echo "LLVM_BIN=$FOUND" >> "$GITHUB_ENV"
          echo "$FOUND"          >> "$GITHUB_PATH"

      - name: Assemble kernel_platform from both repos
        run: |
          set -eux
          # common/ comes from the kernel repo
          git clone --depth 1 --branch "$BASE_BRANCH" \
              "https://github.com/$BASE_REPO.git" kp/common
          du -sh kp/common

          # build/ oplus/ qcom/ + vendor/ come from the vendor repo
          git clone --depth 1 --branch "$VENDOR_BRANCH" \
              "https://github.com/$VENDOR_REPO.git" kp_vendor
          for d in build oplus qcom; do
            if [ -d "kp_vendor/kernel_platform/$d" ]; then
              mv "kp_vendor/kernel_platform/$d" "kp/$d"
            fi
          done
          if [ -d kp_vendor/vendor ]; then mv kp_vendor/vendor kp/vendor; fi
          rm -rf kp_vendor
          du -sh kp

          echo "--- layout ---"
          ls -la kp
          echo "--- symlink targets resolve? ---"
          ls -la kp/common/drivers/soc/oplus/ || true
          test -e kp/common/drivers/soc/oplus/storage/Kconfig \
            && echo "OK: storage/Kconfig resolves through the symlink" \
            || echo "WARN: storage/Kconfig still missing"

      - name: Apply overlay
        run: bash scripts/apply_overlay.sh kp/common overlay

      - name: Apply config (writes .config)
        run: |
          mkdir -p kp/common
          cp -f config/fengchi_defconfig kp/common/.config
          ls -la kp/common/.config
          echo "--- critical entries ---"
          grep -E 'CONFIG_DEBUG_INFO=|CONFIG_SCHED_CLASS_EXT|CONFIG_HMBIRD_SCHED|CONFIG_BOEFFLA' kp/common/.config || true
          if grep -q '^CONFIG_DEBUG_INFO=y' kp/common/.config; then
            echo "::error::CONFIG_DEBUG_INFO=y in the shipped defconfig"; exit 1
          fi

      - name: Sanity-check config against the tree
        working-directory: kp/common
        run: |
          make ARCH=arm64 SRCARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ \
               olddefconfig
          echo "--- after olddefconfig ---"
          grep -E 'CONFIG_DEBUG_INFO=|CONFIG_SCHED_CLASS_EXT|CONFIG_HMBIRD_SCHED' .config || true
          if grep -q '^CONFIG_DEBUG_INFO=y' .config; then
            echo "::error::olddefconfig turned DEBUG_INFO back on"; exit 1
          fi

      - name: Build Image
        working-directory: kp/common
        run: |
          echo "start $(date -u +%H:%M:%S)"
          make ARCH=arm64 SRCARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc HOSTCXX=g++ \
               KCFLAGS=-Wno-error -j$(nproc) Image
          echo "end $(date -u +%H:%M:%S)"
          ls -la arch/arm64/boot/Image

      - name: Verify Image layout
        run: python3 scripts/verify_image.py kp/common/arch/arm64/boot/Image

      - name: Pack boot.img
        run: python3 scripts/pack_boot.py kp/common/arch/arm64/boot/Image . out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fengchi-boot-images
          path: |
            out/*.img
            out/*.txt
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fengchi Kernel build #${{ github.run_number }}
          body: |
            Base: ${{ env.BASE_REPO }} @ ${{ env.BASE_BRANCH }}
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.run_number }}
          files: |
            out/*.img
            out/*.txt
          draft: false
